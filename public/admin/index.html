<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS: drop-in successor to Decap/Netlify CMS. Reuses config.yml.
         No stylesheet, no `type="module"`, and no netlify-identity-widget —
         auth is GitHub OAuth via the sveltia-cms-auth Worker (see config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- Simple document-style preview: the text content (Art Description +
         Credits) first, then every image stacked one after another. No navbar,
         no icon, no carousel. Typography is ported from ContentPage.vue (black
         text, Georgia Light serif, uppercase credits, zeroed <p> margins). For
         the exact page (chrome, layout, animated icons) use "View on live site".
         Sveltia exposes `h` (React.createElement) and `createClass` globally. -->
    <script>
      (function initPreview() {
        var CMS = window.CMS;
        if (!CMS || !CMS.registerPreviewStyle || !window.h || !window.createClass) {
          return void setTimeout(initPreview, 100);
        }
        var h = window.h;

        CMS.registerPreviewStyle(
          `
          * { box-sizing: border-box; }
          body {
            margin: 0;
            padding: 1.5rem;
            color: #000;
            font-family: "Helvetica", Arial, sans-serif;
          }
          .project-content p { margin: 0; }

          .project-content {
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 2rem;
          }
          .project-content .project-description {
            font-family: "Georgia Light", serif;
            line-height: 1.2em;
          }
          .project-content .project-credits {
            padding-top: 0.5em;
            font-size: smaller;
            line-height: 1.2em;
            text-transform: uppercase;
          }
          .project-description a, .project-credits a {
            color: inherit; text-decoration: none; text-transform: uppercase;
          }
          .project-description a:hover, .project-credits a:hover {
            font-style: italic; text-decoration: underline dotted; text-underline-offset: 2px;
          }

          /* All images, one after another. */
          .preview-images { display: flex; flex-direction: column; gap: 1.5rem; }
          .preview-images figure { margin: 0; }
          .preview-images img {
            max-width: 100%;
            height: auto;
            display: block;
          }
          `,
          { raw: true },
        );

        var ProjectPreview = window.createClass({
          render: function () {
            var props = this.props;
            var data = props.entry.get("data");
            var getAsset = props.getAsset;
            var widgetFor = props.widgetFor;

            var assetUrl = function (path) {
              if (!path) return "";
              var a = getAsset(path);
              return a ? a.url || String(a) : "";
            };
            var has = function (name) {
              return data && data.has ? data.has(name) : false;
            };
            var hasDescription = has("description");
            var hasCredits = has("credits");

            var year = data.get("year");
            var images = data.get("images");

            // Text content first.
            var creditsBlock =
              hasCredits || year
                ? h(
                    "div",
                    { className: "project-credits" },
                    year ? h("span", { className: "project-year" }, year) : null,
                    year ? h("br") : null,
                    hasCredits ? widgetFor("credits") : null,
                  )
                : null;
            var textColumn = h(
              "div",
              { className: "project-content" },
              hasDescription
                ? h("div", { className: "project-description" }, widgetFor("description"))
                : null,
              creditsBlock,
            );

            // Then every image, one after another.
            var imagesBlock = null;
            if (images && images.forEach) {
              var figures = [];
              images.forEach(function (img, i) {
                var src = img && img.get ? img.get("src") : null;
                if (!src) return;
                figures.push(
                  h(
                    "figure",
                    { key: i },
                    h("img", { src: assetUrl(src), alt: img.get("caption") || "" }),
                  ),
                );
              });
              if (figures.length) {
                imagesBlock = h("div", { className: "preview-images" }, figures);
              }
            }

            return h("div", { className: "preview-root" }, textColumn, imagesBlock);
          },
        });

        // Register for every collection. Spaces/Words are folder collections
        // (singular names "space"/"word"). About is a files collection — Sveltia
        // matches by the collection name OR the file name, so register both.
        ["space", "word", "about", "bio", "calendar", "press", "contact"].forEach(
          function (name) {
            CMS.registerPreviewTemplate(name, ProjectPreview);
          },
        );
      })();
    </script>
  </body>
</html>
