<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS: drop-in successor to Decap/Netlify CMS. Reuses config.yml.
         No stylesheet, no `type="module"`, and no netlify-identity-widget —
         auth is GitHub OAuth via the sveltia-cms-auth Worker (see config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- Custom preview approximating components/ContentPage.vue. The CSS below is
         ported from that component (exact fonts, sizes, paddings, zeroed <p>
         margins, undefined --color-text => black) and mirrors its real 600px
         responsive breakpoint: since the preview pane is usually < 600px wide, it
         shows the site's MOBILE layout (title visible, single column, text above
         image); when the pane is wide it shows the desktop row (title hidden, 350px
         text column on the right, image left). The interactive carousel is reduced
         to a single static image; for pixel-exact rendering use "View on live site".
         Sveltia exposes `h` (React.createElement) and `createClass` globally. -->
    <script>
      (function initPreview() {
        var CMS = window.CMS;
        if (!CMS || !CMS.registerPreviewStyle || !window.h || !window.createClass) {
          return void setTimeout(initPreview, 100);
        }
        var h = window.h;

        CMS.registerPreviewStyle(
          `
          * { box-sizing: border-box; }
          body {
            margin: 0;
            padding: 1.5rem;
            color: #000;
            font-family: "Helvetica", Arial, sans-serif;
          }
          /* Site zeroes paragraph margins (:deep(p){margin:0}). */
          .project-content p { margin: 0; }

          /* Title is hidden on desktop (shown only in the mobile layout), exactly
             as on the site (.page-title { display: none }). */
          .page-title { display: none; }

          /* Desktop: image left, 350px text column on the right. row-reverse puts
             the (DOM-first) text column on the right while keeping text-above-image
             order for the mobile column layout below. */
          .content-wrapper {
            display: flex;
            flex-direction: row-reverse;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 24px;
          }
          .preview-image-area {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            justify-content: center;
          }
          .preview-image-area img {
            max-width: 100%;
            max-height: 70vh;
            height: auto;
            object-fit: contain;
            display: block;
          }

          .project-content {
            width: 350px;
            flex: 0 0 auto;
            padding-right: 1em;
            padding-bottom: 1em;
            white-space: pre-wrap;
            word-break: break-word;
          }
          .project-content .project-description {
            font-family: "Georgia Light", serif;
            line-height: 1.2em;
          }
          .project-content .project-credits {
            padding-top: 0.5em;
            font-size: smaller;
            line-height: 1.2em;
            text-transform: uppercase;
          }
          .project-description a, .project-credits a {
            color: inherit; text-decoration: none; text-transform: uppercase;
          }
          .project-description a:hover, .project-credits a:hover {
            font-style: italic; text-decoration: underline dotted; text-underline-offset: 2px;
          }

          /* Mirror the site's mobile layout at the same 600px breakpoint. The
             preview pane is usually narrower than this, so this is what editors see. */
          @media screen and (max-width: 600px) {
            .page-title {
              display: block;
              text-transform: uppercase;
              font-size: 1.2rem;
              margin-bottom: 1.25rem;
            }
            .content-wrapper {
              flex-direction: column;
              align-items: center;
            }
            .project-content {
              width: auto;
              max-width: none;
              padding: 0;
              font-size: 1.1rem;
            }
            .preview-image-area { width: 100%; margin-top: 1.5rem; }
          }
          `,
          { raw: true },
        );

        var ProjectPreview = window.createClass({
          render: function () {
            var props = this.props;
            var data = props.entry.get("data");
            var getAsset = props.getAsset;
            var widgetFor = props.widgetFor;

            var title = data.get("title");
            var year = data.get("year");
            var images = data.get("images");

            // Only call widgetFor() for fields the entry actually has — About files
            // have `description` (bio) OR `credits` (others), not both, and
            // widgetFor() on a missing field throws ("reading 'widget' of undefined").
            var has = function (name) {
              return data && data.has ? data.has(name) : false;
            };
            var hasDescription = has("description");
            var hasCredits = has("credits");

            // Single static image (first of the list) for layout context.
            var imageArea = null;
            var first = images && images.get ? images.get(0) : null;
            var firstSrc = first && first.get ? first.get("src") : null;
            if (firstSrc) {
              var asset = getAsset(firstSrc);
              var url = asset ? asset.url || String(asset) : "";
              imageArea = h(
                "div",
                { className: "preview-image-area" },
                h("img", { className: "project-image", src: url, alt: first.get("caption") || "" }),
              );
            }

            var creditsBlock =
              hasCredits || year
                ? h(
                    "div",
                    { className: "project-credits" },
                    year ? h("span", { className: "project-year" }, year) : null,
                    year ? h("br") : null,
                    hasCredits ? widgetFor("credits") : null,
                  )
                : null;

            return h(
              "div",
              { className: "project-container" },
              h("div", { className: "page-title" }, title || ""),
              h(
                "div",
                { className: "content-wrapper" },
                // Text column first in the DOM (matches the site) so it sits above
                // the image on mobile; row-reverse moves it right on desktop.
                h(
                  "div",
                  { className: "project-content" },
                  hasDescription
                    ? h("div", { className: "project-description" }, widgetFor("description"))
                    : null,
                  creditsBlock,
                ),
                imageArea,
              ),
            );
          },
        });

        // Register for every collection. Spaces/Words are folder collections
        // (singular names "space"/"word"). About is a files collection — Sveltia
        // matches by the collection name OR the file name, so register both.
        ["space", "word", "about", "bio", "calendar", "press", "contact"].forEach(
          function (name) {
            CMS.registerPreviewTemplate(name, ProjectPreview);
          },
        );
      })();
    </script>
  </body>
</html>
