<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS: drop-in successor to Decap/Netlify CMS. Reuses config.yml.
         No stylesheet, no `type="module"`, and no netlify-identity-widget —
         auth is GitHub OAuth via the sveltia-cms-auth Worker (see config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- Custom preview: an APPROXIMATION of components/ContentPage.vue focused on
         the TEXT within the page's horizontal layout — a single static image on
         the left for context and the 350px text column (Art Description + Credits)
         on the right, matching the desktop `.content-wrapper { flex-direction: row }`.
         The interactive carousel is intentionally dropped; the point is to see text
         edits in place. For pixel-exact rendering use the "View on live site" link.
         Sveltia exposes `h` (React.createElement) and `createClass` globally. -->
    <script>
      (function initPreview() {
        var CMS = window.CMS;
        // Wait until Sveltia and its no-build globals are ready.
        if (!CMS || !CMS.registerPreviewStyle || !window.h || !window.createClass) {
          return void setTimeout(initPreview, 100);
        }
        var h = window.h;

        // --- Preview styling: mirrors ContentPage.vue horizontal layout ----------
        CMS.registerPreviewStyle(
          `
          :root { --color-text: #111; }
          body {
            margin: 0;
            padding: 24px 28px;
            color: var(--color-text);
            font-family: "Helvetica", Arial, sans-serif;
            line-height: 1.4;
          }
          .preview-title { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
          /* Desktop-style horizontal row: image left, text column right.
             Wraps to a stack when the preview pane is narrow. */
          .content-wrapper {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 24px;
          }
          .preview-image-area {
            flex: 1 1 240px;
            min-width: 0;
            display: flex;
            justify-content: center;
          }
          .preview-image-area img {
            max-width: 100%;
            max-height: 70vh;
            height: auto;
            object-fit: contain;
            display: block;
          }
          /* The 350px text column, as on the site. */
          .project-content { flex: 0 1 350px; }
          .project-description {
            font-family: "Georgia", "Georgia Light", serif;
            line-height: 1.2;
            white-space: pre-wrap;
            word-break: break-word;
          }
          .project-credits {
            padding-top: 0.5em;
            font-size: smaller;
            line-height: 1.2;
            text-transform: uppercase;
            white-space: pre-wrap;
          }
          .project-description a, .project-credits a {
            color: var(--color-text); text-decoration: none; text-transform: uppercase;
          }
          .project-description a:hover, .project-credits a:hover {
            font-style: italic; text-decoration: underline dotted; text-underline-offset: 2px;
          }
          `,
          { raw: true },
        );

        // --- Preview template: title + [image | text column] ---------------------
        var ProjectPreview = window.createClass({
          render: function () {
            var props = this.props;
            var data = props.entry.get("data");
            var getAsset = props.getAsset;
            var widgetFor = props.widgetFor;

            var title = data.get("title");
            var year = data.get("year");
            var images = data.get("images");

            // Single static image for layout context (first in the list).
            var imageArea = null;
            var first = images && images.get ? images.get(0) : null;
            var firstSrc = first && first.get ? first.get("src") : null;
            if (firstSrc) {
              var asset = getAsset(firstSrc);
              var url = asset ? asset.url || String(asset) : "";
              imageArea = h(
                "div",
                { className: "preview-image-area" },
                h("img", { className: "project-image", src: url, alt: first.get("caption") || "" }),
              );
            }

            // Only call widgetFor() for fields the entry actually has — About
            // files have `description` (bio) OR `credits` (others), not both, and
            // widgetFor() on a missing field throws ("reading 'widget' of undefined").
            var has = function (name) {
              return data && data.has ? data.has(name) : false;
            };
            var hasDescription = has("description");
            var hasCredits = has("credits");

            var creditsBlock =
              hasCredits || year
                ? h(
                    "div",
                    { className: "project-credits" },
                    year ? h("span", { className: "project-year" }, year) : null,
                    year ? h("br") : null,
                    hasCredits ? widgetFor("credits") : null,
                  )
                : null;

            return h(
              "div",
              { className: "project-container" },
              h("div", { className: "preview-title" }, title || "Untitled"),
              h(
                "div",
                { className: "content-wrapper" },
                imageArea,
                h(
                  "div",
                  { className: "project-content" },
                  hasDescription
                    ? h("div", { className: "project-description" }, widgetFor("description"))
                    : null,
                  creditsBlock,
                ),
              ),
            );
          },
        });

        // Register for every collection. Spaces/Words are folder collections
        // (singular names "space"/"word"). About is a files collection — Sveltia
        // matches by the collection name OR the file name, so register both to be
        // safe. About entries have no images/year and use `description` (bio) or
        // `credits` (others); the template renders whichever field exists.
        [
          "space",
          "word",
          "about",
          "bio",
          "calendar",
          "press",
          "contact",
        ].forEach(function (name) {
          CMS.registerPreviewTemplate(name, ProjectPreview);
        });
      })();
    </script>
  </body>
</html>
