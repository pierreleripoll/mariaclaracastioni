<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS: drop-in successor to Decap/Netlify CMS. Reuses config.yml.
         No stylesheet, no `type="module"`, and no netlify-identity-widget —
         auth is GitHub OAuth via the sveltia-cms-auth Worker (see config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- Custom preview approximating the full page (app.vue + ContentPage.vue):
         navbar (MARIA CLARA CASTIONI + Spaces/Words/About), the multi-image
         carousel, the text column, and the selected project's icon pinned
         bottom-left. Ported styles: black text, Georgia Light serif, uppercase
         credits, zeroed <p> margins, real 600px breakpoint (narrow pane => site
         mobile layout). NOT reproduced: the other projects' icons — on the live
         site they wander randomly via simplex-noise animation, so there is no
         fixed layout to match. For the exact page use "View on live site".
         Sveltia exposes `h` (React.createElement) and `createClass` globally. -->
    <script>
      (function initPreview() {
        var CMS = window.CMS;
        if (!CMS || !CMS.registerPreviewStyle || !window.h || !window.createClass) {
          return void setTimeout(initPreview, 100);
        }
        var h = window.h;

        CMS.registerPreviewStyle(
          `
          * { box-sizing: border-box; }
          body {
            margin: 0;
            padding: 1.5rem;
            color: #000;
            font-family: "Helvetica", Arial, sans-serif;
          }
          .project-content p { margin: 0; }

          /* Page shell — position:relative so the selected icon can pin to it. */
          .preview-page { position: relative; min-height: 80vh; padding-bottom: 120px; }

          /* Navbar (app.vue + Navbar.vue): uppercase, black, 16px/500. */
          .preview-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem 1.5rem;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
          }
          .preview-navbar .navbar-title { font-size: 16px; font-weight: 500; }
          .preview-navbar ul {
            list-style: none; display: flex; gap: 1.5rem; margin: 0; padding: 0;
          }
          .preview-navbar li { font-size: 16px; font-weight: 500; color: #000; }
          .preview-navbar li.active { text-decoration: underline; text-underline-offset: 2px; }

          /* Desktop: image left, 350px text column right (row-reverse keeps the
             DOM-first text column above the image on mobile). */
          .content-wrapper {
            display: flex;
            flex-direction: row-reverse;
            align-items: flex-start;
            justify-content: flex-end;
            gap: 24px;
          }
          /* Multi-image carousel -> vertical stack, 60vh each, contain. */
          .preview-image-area {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
          }
          .preview-image-area figure { margin: 0; width: 100%; text-align: center; }
          .preview-image-area img {
            max-width: 100%;
            max-height: 60vh;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
          }

          .project-content {
            width: 350px;
            flex: 0 0 auto;
            padding-right: 1em;
            padding-bottom: 1em;
            white-space: pre-wrap;
            word-break: break-word;
          }
          .project-content .project-description {
            font-family: "Georgia Light", serif;
            line-height: 1.2em;
          }
          .project-content .project-credits {
            padding-top: 0.5em;
            font-size: smaller;
            line-height: 1.2em;
            text-transform: uppercase;
          }
          .project-description a, .project-credits a {
            color: inherit; text-decoration: none; text-transform: uppercase;
          }
          .project-description a:hover, .project-credits a:hover {
            font-style: italic; text-decoration: underline dotted; text-underline-offset: 2px;
          }

          /* Selected project's icon: pinned bottom-left, as on the live page. */
          .selected-icon { position: absolute; left: 0; bottom: 0; width: 90px; }
          .selected-icon img { width: 100%; height: auto; object-fit: contain; display: block; }

          /* Mirror the site's mobile layout at the same 600px breakpoint. */
          @media screen and (max-width: 600px) {
            .content-wrapper { flex-direction: column; align-items: center; }
            .project-content { width: auto; max-width: none; padding: 0; font-size: 1.1rem; }
            .preview-image-area { width: 100%; margin-top: 1.5rem; }
            .selected-icon { width: 64px; }
          }
          `,
          { raw: true },
        );

        var ProjectPreview = window.createClass({
          render: function () {
            var props = this.props;
            var entry = props.entry;
            var data = entry.get("data");
            var getAsset = props.getAsset;
            var widgetFor = props.widgetFor;

            var assetUrl = function (path) {
              if (!path) return "";
              var a = getAsset(path);
              return a ? a.url || String(a) : "";
            };
            var has = function (name) {
              return data && data.has ? data.has(name) : false;
            };
            var hasDescription = has("description");
            var hasCredits = has("credits");

            var year = data.get("year");
            var images = data.get("images");

            // --- Navbar (active item from the collection being edited) ----------
            var collection = entry.get("collection");
            var active =
              collection === "space" ? "spaces" : collection === "word" ? "words" : "about";
            var navItem = function (label, key) {
              return h("li", { className: active === key ? "active" : "" }, label);
            };
            var navbar = h(
              "nav",
              { className: "preview-navbar" },
              h("span", { className: "navbar-title" }, "MARIA CLARA CASTIONI"),
              h(
                "ul",
                null,
                navItem("Spaces", "spaces"),
                navItem("Words", "words"),
                navItem("About", "about"),
              ),
            );

            // --- Carousel: every image, stacked (60vh each) ---------------------
            var imageArea = null;
            if (images && images.forEach) {
              var figures = [];
              images.forEach(function (img, i) {
                var src = img && img.get ? img.get("src") : null;
                if (!src) return;
                figures.push(
                  h(
                    "figure",
                    { key: i },
                    h("img", {
                      className: "project-image",
                      src: assetUrl(src),
                      alt: img.get("caption") || "",
                    }),
                  ),
                );
              });
              if (figures.length) {
                imageArea = h("div", { className: "preview-image-area" }, figures);
              }
            }

            // --- Text column ----------------------------------------------------
            var creditsBlock =
              hasCredits || year
                ? h(
                    "div",
                    { className: "project-credits" },
                    year ? h("span", { className: "project-year" }, year) : null,
                    year ? h("br") : null,
                    hasCredits ? widgetFor("credits") : null,
                  )
                : null;
            var textColumn = h(
              "div",
              { className: "project-content" },
              hasDescription
                ? h("div", { className: "project-description" }, widgetFor("description"))
                : null,
              creditsBlock,
            );

            // --- Selected project's icon (pinned bottom-left) -------------------
            var iconPath = data.get("icon");
            var selectedIcon = iconPath
              ? h(
                  "div",
                  { className: "selected-icon" },
                  h("img", { src: assetUrl(iconPath), alt: "" }),
                )
              : null;

            return h(
              "div",
              { className: "preview-page" },
              navbar,
              h("div", { className: "content-wrapper" }, textColumn, imageArea),
              selectedIcon,
            );
          },
        });

        // Register for every collection. Spaces/Words are folder collections
        // (singular names "space"/"word"). About is a files collection — Sveltia
        // matches by the collection name OR the file name, so register both.
        ["space", "word", "about", "bio", "calendar", "press", "contact"].forEach(
          function (name) {
            CMS.registerPreviewTemplate(name, ProjectPreview);
          },
        );
      })();
    </script>
  </body>
</html>
