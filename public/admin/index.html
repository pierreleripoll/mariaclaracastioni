<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- Sveltia CMS: drop-in successor to Decap/Netlify CMS. Reuses config.yml.
         No stylesheet, no `type="module"`, and no netlify-identity-widget —
         auth is GitHub OAuth via the sveltia-cms-auth Worker (see config.yml). -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- Custom preview: an APPROXIMATION of components/ContentPage.vue (image +
         Art Description + Credits) so the pane looks like the real page.
         Caveats: this is a hand-maintained React copy of the Vue layout, so it can
         drift from the source; the interactive carousel is reduced to a static
         image stack. For pixel-exact rendering use the "View on live site" link
         (site_url + preview_path in config.yml), which opens the real page.
         Sveltia exposes `h` (React.createElement) and `createClass` globally for
         no-build inline templates. -->
    <script>
      (function initPreview() {
        var CMS = window.CMS;
        // Wait until Sveltia and its no-build globals are ready.
        if (!CMS || !CMS.registerPreviewStyle || !window.h || !window.createClass) {
          return void setTimeout(initPreview, 100);
        }
        var h = window.h;

        // --- Preview styling: mirrors ContentPage.vue typography/classes ---------
        CMS.registerPreviewStyle(
          `
          :root { --color-text: #111; }
          body {
            margin: 0;
            padding: 24px 28px;
            color: var(--color-text);
            font-family: "Helvetica", Arial, sans-serif;
            line-height: 1.4;
          }
          .preview-title { font-size: 28px; font-weight: bold; margin-bottom: 16px; }
          .preview-images { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
          .preview-figure { margin: 0; }
          .project-image { width: 100%; height: auto; object-fit: contain; display: block; }
          .preview-figure figcaption {
            font-size: smaller; text-transform: uppercase; margin-top: 4px; opacity: 0.75;
          }
          /* Art description = the site's marquee prose (Georgia serif). */
          .project-description {
            font-family: "Georgia", "Georgia Light", serif;
            line-height: 1.2;
            white-space: pre-wrap;
            word-break: break-word;
          }
          .project-credits {
            padding-top: 0.5em;
            font-size: smaller;
            line-height: 1.2;
            text-transform: uppercase;
            white-space: pre-wrap;
          }
          .project-description a, .project-credits a {
            color: var(--color-text); text-decoration: none; text-transform: uppercase;
          }
          .project-description a:hover, .project-credits a:hover {
            font-style: italic; text-decoration: underline dotted; text-underline-offset: 2px;
          }
          `,
          { raw: true },
        );

        // --- Preview template: title + images + description + credits ------------
        var ProjectPreview = window.createClass({
          render: function () {
            var props = this.props;
            var data = props.entry.get("data");
            var getAsset = props.getAsset;
            var widgetFor = props.widgetFor;

            var title = data.get("title");
            var year = data.get("year");
            var images = data.get("images");

            var figures = [];
            if (images && images.forEach) {
              images.forEach(function (img, i) {
                var src = img.get("src");
                if (!src) return;
                var asset = getAsset(src);
                var url = asset ? asset.url || String(asset) : "";
                var caption = img.get("caption");
                figures.push(
                  h(
                    "figure",
                    { className: "preview-figure", key: i },
                    h("img", { className: "project-image", src: url, alt: caption || "" }),
                    caption ? h("figcaption", null, caption) : null,
                  ),
                );
              });
            }

            return h(
              "div",
              { className: "project-container" },
              h("div", { className: "preview-title" }, title || "Untitled"),
              figures.length ? h("div", { className: "preview-images" }, figures) : null,
              h("div", { className: "project-description" }, widgetFor("description")),
              h(
                "div",
                { className: "project-credits" },
                year ? h("span", { className: "project-year" }, year) : null,
                year ? h("br") : null,
                widgetFor("credits"),
              ),
            );
          },
        });

        // Collection names from config.yml (singular): "space" and "word".
        CMS.registerPreviewTemplate("space", ProjectPreview);
        CMS.registerPreviewTemplate("word", ProjectPreview);
      })();
    </script>
  </body>
</html>
