# Sveltia CMS — GitHub backend with OAuth via the sveltia-cms-auth Worker.
# On this `staging` branch, the CMS reads/writes the `staging` branch only, so
# test edits never touch production (main / Netlify / Decap).
backend:
  name: github
  repo: pierreleripoll/mariaclaracastioni
  branch: staging
  # URL of the deployed sveltia-cms-auth Cloudflare Worker (OAuth broker).
  # CONFIRM this matches the Worker's real *.workers.dev URL after you deploy it,
  # and use "<this-url>/callback" as the GitHub OAuth App callback URL.
  base_url: https://sveltia-cms-auth.pierreripoll13-d89.workers.dev

# Base URL for the "View on live site" link shown in the editor. On staging this
# points at the staging deploy — the pixel-exact preview (real Vue components/CSS)
# once the build finishes. Per-collection preview_path builds the full URL.
site_url: https://staging.mariaclaracastioni.ch

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: "space"
    label: "Spaces"
    folder: "content/1.spaces"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    # "View on live site" -> /spaces/<slug> on the staging deploy.
    preview_path: "spaces/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Year", name: "year", widget: "string" }
      - label: "Navigation"
        name: "navigation"
        widget: "object"
        fields:
          - label: "Order"
            name: "order"
            widget: "number"
            min: 0
            default: 0
            value_type: "int"
      - label: "Icon"
        name: "icon"
        widget: "image"
        hint: "Upload a PNG icon for the project. Please ensure the file is in PNG format."
      - label: "Images"
        name: "images"
        widget: "list"
        # Collapse each entry into a compact row (thumbnail + caption). Sveltia's
        # reorder handle lives on the collapsed row, so collapsing makes the
        # images easy to drag/reorder — the equivalent of Decap's drag cards.
        collapsed: true
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string" }
      - label: "Art Description"
        name: "description"
        widget: "markdown"
      - label: "Credits"
        name: "credits"
        widget: "markdown"

  - name: "word"
    label: "Words"
    folder: "content/2.words"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    # "View on live site" -> /words/<slug> on the staging deploy.
    preview_path: "words/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - label: "Navigation"
        name: "navigation"
        widget: "object"
        fields:
          - label: "Order"
            name: "order"
            widget: "number"
            min: 0
            default: 0
            value_type: "int"
      - label: "Icon"
        name: "icon"
        widget: "image"
        hint: "Upload a PNG icon for the project. Please ensure the file is in PNG format."
      - label: "Images"
        name: "images"
        widget: "list"
        # Collapse each entry into a compact row (thumbnail + caption). Sveltia's
        # reorder handle lives on the collapsed row, so collapsing makes the
        # images easy to drag/reorder — the equivalent of Decap's drag cards.
        collapsed: true
        summary: "{{fields.caption}}"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Caption", name: "caption", widget: "string" }
      - label: "Text"
        name: "description"
        widget: "markdown"
      - label: "Credits"
        name: "credits"
        widget: "markdown"

  - name: "about"
    label: "About"
    files:
      - file: "content/3.about/bio.md"
        label: "Bio"
        name: "bio"
        preview_path: "about/bio"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - { label: "Description", name: "description", widget: "markdown" }
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - label: "Order"
                name: "order"
                widget: "number"
                default: 0
                min: 0
                value_type: "int"

      - file: "content/3.about/calendar.md"
        label: "Calendar"
        name: "calendar"
        preview_path: "about/calendar"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - { label: "Description", name: "credits", widget: "markdown" }
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - label: "Order"
                name: "order"
                widget: "number"
                default: 0
                min: 0
                value_type: "int"
      - file: "content/3.about/press.md"
        label: "Press"
        name: "press"
        preview_path: "about/press"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - { label: "Description", name: "credits", widget: "markdown" }
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - label: "Order"
                name: "order"
                widget: "number"
                default: 0
                min: 0
                value_type: "int"
      - file: "content/3.about/contact.md"
        label: "Contact"
        name: "contact"
        preview_path: "about/contact"
        fields:
          - { label: "Title", name: "title", widget: "string", required: true }
          - { label: "Description", name: "credits", widget: "markdown" }
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - label: "Order"
                name: "order"
                widget: "number"
                default: 0
                min: 0
                value_type: "int"
